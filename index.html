<!DOCTYPE html>
<html lang="zh-TW" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChicTouch Pro - AI 穩定修正版</title>
    
    <!-- 基礎庫 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@3.9.0/dist/full.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/exif-js"></script>
    
    <!-- 【修正點 1】使用具備完整路徑的 MediaPipe 資源 -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4/face_mesh.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils@0.6/control_utils.js" crossorigin="anonymous"></script>

    <style>
        body { background-color: #f8fafc; transition: background 0.3s; }
        .canvas-container { margin: 0 auto !important; box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1); border-radius: 1rem; overflow: hidden; }
        .loading-overlay { position: fixed; inset: 0; background: rgba(255,255,255,0.9); z-index: 100; display: flex; align-items: center; justify-content: center; flex-direction: column; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <!-- 載入指示器 -->
    <div id="loader" class="loading-overlay">
        <span class="loading loading-ring loading-lg text-primary"></span>
        <p id="loader-msg" class="mt-4 font-bold text-slate-500">正在喚醒 AI 引擎...</p>
        <p class="text-[10px] opacity-50 mt-2">首次加載模型約需 5-10MB 流量</p>
    </div>

    <!-- 頂部欄 -->
    <header class="h-16 bg-base-100 border-b flex items-center justify-between px-6 z-40 shadow-sm">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-primary rounded-xl flex items-center justify-center text-white font-black italic">CP</div>
            <div>
                <h1 class="text-lg font-black tracking-tight">手痕美美 <span class="text-primary italic text-sm text-rose-500">Stable AI</span></h1>
                <p id="ai-status" class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">初始化中</p>
            </div>
        </div>
        <button onclick="executeExport()" class="btn btn-primary btn-sm rounded-full px-6">匯出成品</button>
    </header>

    <main class="flex-1 flex overflow-hidden flex-col md:flex-row">
        <!-- 畫布區 -->
        <section class="flex-1 relative bg-slate-200 p-8 flex items-center justify-center">
            <div id="drop-zone" class="absolute inset-0 z-10 flex flex-col items-center justify-center cursor-pointer hover:bg-slate-300/50 transition" onclick="document.getElementById('file-input').click()">
                <p class="font-bold text-slate-500">點擊或拖放照片</p>
            </div>
            <input type="file" id="file-input" class="hidden" accept="image/*" onchange="processUpload(event)">
            <canvas id="c"></canvas>
        </section>

        <!-- 工具欄 -->
        <aside class="w-full md:w-80 bg-base-100 border-l p-6 space-y-6 overflow-y-auto">
            <div class="card bg-rose-50 p-4 rounded-2xl border border-rose-100">
                <h3 class="text-xs font-black text-rose-400 uppercase mb-3">一鍵美顏</h3>
                <button onclick="quickBeauty()" class="btn btn-rose-500 bg-rose-500 hover:bg-rose-600 text-white border-none w-full btn-sm rounded-xl">自動優化</button>
            </div>

            <div class="space-y-4">
                <h3 class="text-xs font-black text-slate-400 uppercase">手動細修</h3>
                <div>
                    <div class="flex justify-between text-xs mb-1"><span>柔膚</span><span id="v-blur">0</span></div>
                    <input type="range" id="i-blur" min="0" max="20" value="0" class="range range-xs range-primary" oninput="applyEffects()">
                </div>
                <div>
                    <div class="flex justify-between text-xs mb-1"><span>亮度</span><span id="v-bright">100</span></div>
                    <input type="range" id="i-bright" min="50" max="150" value="100" class="range range-xs" oninput="applyEffects()">
                </div>
            </div>

            <div id="face-panel" class="space-y-4 pt-4 border-t opacity-30 pointer-events-none transition-all">
                <h3 class="text-xs font-black text-rose-400 uppercase flex items-center justify-between">
                    AI 局部增強 <span class="badge badge-xs" id="face-badge">未偵測</span>
                </h3>
                <div>
                    <div class="flex justify-between text-xs mb-1"><span>臉部提亮</span><span id="v-face">0</span></div>
                    <input type="range" id="i-face" min="0" max="50" value="0" class="range range-xs range-secondary" oninput="applyEffects()">
                </div>
            </div>
        </aside>
    </main>

    <script>
        let canvas, mainImg, faceMesh, isAiReady = false;

        // 【修正點 2】強化版模型路徑引導
        async function setupAI() {
            try {
                faceMesh = new FaceMesh({
                    locateFile: (file) => {
                        // 強制指向具備版本號的 CDN 路徑，確保 .wasm 和 .tflite 檔案能被找到
                        return `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4/${file}`;
                    }
                });

                faceMesh.setOptions({
                    maxNumFaces: 1,
                    refineLandmarks: true,
                    minDetectionConfidence: 0.5,
                    minTrackingConfidence: 0.5
                });

                faceMesh.onResults(onResults);
                
                // 預熱引擎
                const dummyCanvas = document.createElement('canvas');
                dummyCanvas.width = 1; dummyCanvas.height = 1;
                await faceMesh.send({ image: dummyCanvas });
                
                isAiReady = true;
                document.getElementById('loader').style.display = 'none';
                document.getElementById('ai-status').innerText = "AI 引擎已就緒";
                document.getElementById('ai-status').classList.add('text-green-500');
            } catch (e) {
                console.error("AI 啟動失敗:", e);
                document.getElementById('loader-msg').innerText = "AI 啟動失敗，請重新整理或檢查網路";
                document.getElementById('ai-status').innerText = "僅限手動模式";
            }
        }

        // 畫布初始化
        canvas = new fabric.Canvas('c', { selection: false, backgroundColor: '#fff' });

        async function processUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (f) => {
                const imgEl = new Image();
                imgEl.src = f.target.result;
                imgEl.onload = async () => {
                    fabric.Image.fromURL(f.target.result, (img) => {
                        const scale = Math.min(800 / imgEl.width, 600 / imgEl.height);
                        canvas.clear();
                        canvas.setDimensions({ width: imgEl.width * scale, height: imgEl.height * scale });
                        img.set({ scaleX: scale, scaleY: scale, selectable: false });
                        canvas.add(img);
                        mainImg = img;
                        document.getElementById('drop-zone').style.display = 'none';
                        
                        // 執行 AI 偵測
                        if (isAiReady) {
                            document.getElementById('face-badge').innerText = "辨識中...";
                            faceMesh.send({ image: imgEl });
                        }
                    });
                };
            };
            reader.readAsDataURL(file);
        }

        function onResults(results) {
            const panel = document.getElementById('face-panel');
            const badge = document.getElementById('face-badge');
            
            if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                panel.classList.remove('opacity-30', 'pointer-events-none');
                badge.innerText = "已鎖定人臉";
                badge.className = "badge badge-success text-white badge-xs";
            } else {
                panel.classList.add('opacity-30', 'pointer-events-none');
                badge.innerText = "未偵測到";
            }
        }

        function applyEffects() {
            if (!mainImg) return;
            const blur = document.getElementById('i-blur').value;
            const bright = document.getElementById('i-bright').value;
            const face = document.getElementById('i-face').value;

            document.getElementById('v-blur').innerText = blur;
            document.getElementById('v-bright').innerText = bright;
            document.getElementById('v-face').innerText = face;

            const filters = [
                new fabric.Image.filters.Brightness({ brightness: (bright - 100) / 100 })
            ];
            
            if (blur > 0) filters.push(new fabric.Image.filters.Blur({ blur: blur / 50 }));

            mainImg.filters = filters;
            mainImg.applyFilters();
            canvas.renderAll();
        }

        function quickBeauty() {
            document.getElementById('i-blur').value = 10;
            document.getElementById('i-bright').value = 110;
            applyEffects();
        }

        function executeExport() {
            const dataURL = canvas.toDataURL({ format: 'jpeg', quality: 0.9 });
            const link = document.createElement('a');
            link.download = "chictouch-beauty.jpg";
            link.href = dataURL;
            link.click();
        }

        setupAI();
    </script>
</body>
</html>
