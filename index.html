<!DOCTYPE html>
<html lang="zh-TW" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ChicTouch Pro | 專業 AI 美顏</title>
    
    <!-- 核心庫 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@3.9.0/dist/full.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/exif-js"></script>
    
    <!-- MediaPipe 穩定版本連結 -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

    <style>
        :root { --p-accent: #ff4d94; }
        body { background-color: #f1f5f9; height: 100vh; height: -webkit-fill-available; overflow: hidden; }
        .canvas-container { margin: 0 auto !important; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border-radius: 12px; }
        
        /* 手機版佈局優化 */
        @media (max-width: 768px) {
            .app-container { flex-direction: column; }
            .canvas-area { height: 50vh; padding: 10px; }
            .control-panel { height: 50vh; width: 100% !important; border-radius: 24px 24px 0 0; }
        }

        .sidebar-scroll::-webkit-scrollbar { width: 4px; }
        .sidebar-scroll::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        
        /* 診斷動畫 */
        .ai-scanning { border: 2px solid var(--p-accent); animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body class="flex flex-col">

    <!-- 頂部：診斷與匯出 -->
    <header class="h-14 bg-white border-b px-4 flex items-center justify-between z-50">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 bg-pink-500 rounded-lg flex items-center justify-center text-white font-bold italic text-sm">CP</div>
            <div class="flex flex-col">
                <span class="text-xs font-black leading-none">手痕美美 Pro</span>
                <span id="ai-status" class="text-[9px] font-bold text-slate-400 uppercase tracking-tighter">AI 引擎啟動中...</span>
            </div>
        </div>
        <div class="flex gap-2">
            <button onclick="resetAll()" class="btn btn-ghost btn-xs">重設</button>
            <button id="btn-export" disabled onclick="exportImage()" class="btn btn-primary btn-sm rounded-full px-4 shadow-lg shadow-pink-200">匯出</button>
        </div>
    </header>

    <main class="flex-1 flex app-container overflow-hidden">
        
        <!-- 畫布區：固定顯示 -->
        <section class="flex-1 canvas-area relative flex items-center justify-center bg-slate-100 overflow-hidden">
            <div id="drop-zone" class="absolute inset-0 z-10 flex flex-col items-center justify-center text-slate-400 cursor-pointer" onclick="document.getElementById('file-input').click()">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 mb-2 opacity-20" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
                <p class="text-sm font-bold">點擊上傳照片</p>
                <p class="text-[10px]">支援本機 4K 高解析度處理</p>
            </div>
            <input type="file" id="file-input" class="hidden" accept="image/*" onchange="handleFile(event)">
            
            <div id="canvas-wrapper" class="relative transition-all duration-500">
                <canvas id="c"></canvas>
            </div>
        </section>

        <!-- 控制面板：手機版為底部抽屜 -->
        <aside class="control-panel w-80 bg-white border-l shadow-2xl flex flex-col sidebar-scroll overflow-y-auto">
            <div class="p-6 space-y-8 pb-20">
                
                <!-- 1. 快速自動 -->
                <div>
                    <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4">智能優化</h3>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="applyPreset('natural')" class="btn btn-outline btn-sm rounded-xl">自然</button>
                        <button onclick="applyPreset('glam')" class="btn btn-secondary btn-sm rounded-xl">精緻</button>
                    </div>
                </div>

                <!-- 2. 手動美化 -->
                <div class="space-y-6">
                    <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4">影像細修</h3>
                    
                    <div class="space-y-2">
                        <div class="flex justify-between text-xs font-bold"><span>柔膚細緻</span><span id="v-blur" class="text-pink-500">0</span></div>
                        <input type="range" id="i-blur" min="0" max="20" value="0" class="range range-xs range-secondary" oninput="syncFilters()">
                    </div>

                    <div class="space-y-2">
                        <div class="flex justify-between text-xs font-bold"><span>亮肌美白</span><span id="v-bright" class="text-pink-500">100</span></div>
                        <input type="range" id="i-bright" min="50" max="150" value="100" class="range range-xs" oninput="syncFilters()">
                    </div>

                    <div class="space-y-2">
                        <div class="flex justify-between text-xs font-bold"><span>鮮豔色彩</span><span id="v-sat" class="text-pink-500">0</span></div>
                        <input type="range" id="i-sat" min="-100" max="100" value="0" class="range range-xs range-info" oninput="syncFilters()">
                    </div>
                </div>

                <!-- 3. AI 水印 (EXIF 讀取) -->
                <div class="pt-6 border-t">
                    <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4">專業水印</h3>
                    <div class="form-control">
                        <label class="label cursor-pointer p-0">
                            <span class="label-text text-xs font-bold">顯示拍攝參數 (EXIF)</span> 
                            <input type="checkbox" id="wm-toggle" class="toggle toggle-secondary toggle-sm" onchange="syncFilters()">
                        </label>
                    </div>
                </div>

                <!-- 4. 偵測診斷資訊 -->
                <div class="p-4 bg-slate-50 rounded-2xl">
                    <h4 class="text-[9px] font-bold text-slate-400 uppercase mb-2">AI 診斷日誌</h4>
                    <ul id="diag-log" class="text-[9px] font-mono text-slate-500 space-y-1">
                        <li>> 等待影像輸入...</li>
                    </ul>
                </div>
            </div>
        </aside>
    </main>

    <script>
        let canvas, mainImg, faceMesh, exifData = {};

        // 1. 深度診斷：模型載入邏輯
        async function initAI() {
            const status = document.getElementById('ai-status');
            logDiag("正在載入 WebAssembly 模型...");
            
            try {
                faceMesh = new FaceMesh({
                    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
                });

                faceMesh.setOptions({
                    maxNumFaces: 1,
                    refineLandmarks: true,
                    minDetectionConfidence: 0.5
                });

                faceMesh.onResults(onFaceResults);
                
                status.innerText = "AI 引擎就緒";
                status.classList.add('text-green-500');
                logDiag("AI 引擎啟動成功");
            } catch (e) {
                status.innerText = "AI 啟動失敗";
                logDiag("錯誤: 模型載入攔截");
            }
        }

        // 2. 影像預處理：解決偵測失敗的核心
        async function handleFile(e) {
            const file = e.target.files[0];
            if (!file) return;

            logDiag("讀取影像中...");
            const reader = new FileReader();
            reader.onload = (f) => {
                const imgEl = new Image();
                imgEl.src = f.target.result;
                imgEl.onload = async () => {
                    // 提取 EXIF
                    EXIF.getData(imgEl, function() {
                        exifData = EXIF.getAllTags(this);
                        logDiag("EXIF 數據已提取: " + (exifData.Model || "未知設備"));
                    });

                    fabric.Image.fromURL(f.target.result, (img) => {
                        setupCanvas(img, imgEl);
                        
                        // 關鍵修正：將影像縮小後再交給 AI 偵測，提高手機成功率
                        const aiCanvas = document.createElement('canvas');
                        const ctx = aiCanvas.getContext('2d');
                        aiCanvas.width = 640; // 偵測用標準尺寸
                        aiCanvas.height = 640 * (imgEl.height / imgEl.width);
                        ctx.drawImage(imgEl, 0, 0, aiCanvas.width, aiCanvas.height);
                        
                        logDiag("啟動 AI 人臉掃描...");
                        document.getElementById('canvas-wrapper').classList.add('ai-scanning');
                        faceMesh.send({ image: aiCanvas });
                    });
                };
            };
            reader.readAsDataURL(file);
        }

        function setupCanvas(img, imgEl) {
            canvas.clear();
            const maxW = window.innerWidth > 768 ? 800 : window.innerWidth - 40;
            const maxH = window.innerHeight > 768 ? 600 : window.innerHeight / 2.5;
            const scale = Math.min(maxW / imgEl.width, maxH / imgEl.height);
            
            canvas.setDimensions({ width: imgEl.width * scale, height: imgEl.height * scale });
            img.set({ scaleX: scale, scaleY: scale, selectable: false });
            canvas.add(img);
            mainImg = img;
            
            document.getElementById('drop-zone').style.display = 'none';
            document.getElementById('btn-export').disabled = false;
            logDiag("畫布渲染完成");
        }

        function onFaceResults(results) {
            document.getElementById('canvas-wrapper').classList.remove('ai-scanning');
            if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                logDiag("成功: 偵測到人臉特徵點");
                document.getElementById('ai-status').innerText = "已鎖定人臉";
            } else {
                logDiag("警報: 未偵測到人臉，改用全局模式");
                document.getElementById('ai-status').innerText = "全局美化模式";
            }
        }

        // 3. 效能優化：同步濾鏡
        function syncFilters() {
            if (!mainImg) return;
            const blur = document.getElementById('i-blur').value;
            const bright = document.getElementById('i-bright').value;
            const sat = document.getElementById('i-sat').value;

            document.getElementById('v-blur').innerText = blur;
            document.getElementById('v-bright').innerText = bright;
            document.getElementById('v-sat').innerText = sat;

            const f = fabric.Image.filters;
            mainImg.filters = [
                new f.Brightness({ brightness: (bright - 100) / 100 }),
                new f.Saturation({ saturation: sat / 100 })
            ];
            if (blur > 0) mainImg.filters.push(new f.Blur({ blur: blur / 50 }));

            mainImg.applyFilters();
            
            // 處理水印
            renderWatermark();
            canvas.requestRenderAll();
        }

        function renderWatermark() {
            const old = canvas.getObjects('text');
            old.forEach(o => canvas.remove(o));
            
            if (document.getElementById('wm-toggle').checked) {
                const model = exifData.Model || "Premium Camera";
                const date = exifData.DateTime ? exifData.DateTime.split(' ')[0] : new Date().toLocaleDateString();
                const wm = new fabric.Text(`${model} | ${date}`, {
                    fontSize: 14, fill: '#fff', left: 15, top: canvas.height - 25,
                    fontFamily: 'Helvetica', backgroundColor: 'rgba(0,0,0,0.5)', padding: 5
                });
                canvas.add(wm);
            }
        }

        function logDiag(msg) {
            const log = document.getElementById('diag-log');
            const li = document.createElement('li');
            li.innerText = `> ${msg}`;
            log.prepend(li);
        }

        function applyPreset(type) {
            if (type === 'glam') {
                document.getElementById('i-blur').value = 10;
                document.getElementById('i-bright').value = 115;
            } else {
                document.getElementById('i-blur').value = 5;
                document.getElementById('i-bright').value = 105;
            }
            syncFilters();
        }

        function exportImage() {
            const dataURL = canvas.toDataURL({ format: 'jpeg', quality: 0.9, multiplier: 2 });
            const link = document.createElement('a');
            link.download = "chictouch_beauty.jpg";
            link.href = dataURL;
            link.click();
        }

        function resetAll() { location.reload(); }

        document.addEventListener('DOMContentLoaded', () => {
            canvas = new fabric.Canvas('c', { selection: false });
            initAI();
        });
    </script>
</body>
</html>
