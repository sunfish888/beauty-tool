<!DOCTYPE html>
<html lang="zh-TW" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChicTouch Pro | 專業旅遊影像實驗室</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@3.9.0/dist/full.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/exif-js"></script>
    <style>
        .sidebar-scroll::-webkit-scrollbar { width: 4px; }
        .sidebar-scroll::-webkit-scrollbar-thumb { background: #e5e7eb; border-radius: 10px; }
        #main-canvas-container { box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15); border-radius: 1rem; overflow: hidden; }
    </style>
</head>
<body class="bg-[#F8F9FA] h-screen flex flex-col font-sans text-slate-700">

    <!-- 頂部功能列 -->
    <header class="h-16 bg-white border-b border-slate-100 flex items-center justify-between px-8 z-30">
        <div class="flex items-center gap-4">
            <div class="bg-pink-500 text-white p-2 rounded-xl shadow-lg shadow-pink-200">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-7.714 2.143L11 21l-2.286-6.857L1 12l7.714-2.143L11 3z" /></svg>
            </div>
            <div>
                <h1 class="text-xl font-black tracking-tight text-slate-800">CHICTOUCH <span class="text-pink-500 text-sm italic">PRO</span></h1>
                <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Travel Image Lab</p>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <div id="ai-status" class="badge badge-ghost badge-sm text-[10px] opacity-50">AI 引擎加載中...</div>
            <button onclick="exportImage()" class="btn btn-secondary btn-sm rounded-full px-6 shadow-md shadow-pink-100 font-bold">匯出高解析照片</button>
        </div>
    </header>

    <main class="flex-1 flex overflow-hidden">
        <!-- 左側：編輯畫布 -->
        <section class="flex-1 bg-[#F0F2F5] relative flex items-center justify-center p-12">
            <div id="main-canvas-container" class="relative bg-white">
                <canvas id="canvas"></canvas>
            </div>

            <!-- 上傳引導層 -->
            <div id="upload-guide" class="absolute inset-0 z-10 flex flex-col items-center justify-center bg-slate-50/80 backdrop-blur-sm transition-all">
                <div class="w-20 h-20 bg-white rounded-3xl shadow-xl flex items-center justify-center mb-6 cursor-pointer hover:scale-105 transition active:scale-95" onclick="document.getElementById('file-input').click()">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-pink-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
                </div>
                <h3 class="text-lg font-bold text-slate-800">開始修飾您的旅途回憶</h3>
                <p class="text-slate-400 text-sm mt-2">支援 JPG, PNG, WebP 高解析度照片</p>
                <input type="file" id="file-input" class="hidden" accept="image/*" onchange="handleImageUpload(event)">
            </div>
        </section>

        <!-- 右側：控制面板 -->
        <aside class="w-80 bg-white border-l border-slate-100 flex flex-col shadow-2xl z-20">
            <div class="flex-1 overflow-y-auto sidebar-scroll p-6 space-y-8">
                
                <!-- 1. 自動美顏 -->
                <section>
                    <h4 class="text-[11px] font-black text-slate-400 uppercase tracking-widest mb-4">智能預設</h4>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="applyPreset('natural')" class="btn btn-outline btn-xs rounded-lg hover:bg-pink-500">自然清新</button>
                        <button onclick="applyPreset('glam')" class="btn btn-outline btn-xs rounded-lg hover:bg-pink-500">精緻人像</button>
                    </div>
                </section>

                <!-- 2. 手動細修 -->
                <section class="space-y-6">
                    <h4 class="text-[11px] font-black text-slate-400 uppercase tracking-widest">手動美顏</h4>
                    
                    <div class="space-y-1">
                        <div class="flex justify-between text-xs font-bold"><span>柔膚 (Smooth)</span><span id="val-blur" class="text-pink-500">0</span></div>
                        <input type="range" data-filter="blur" min="0" max="20" value="0" class="range range-xs range-secondary" oninput="updateFilter(this)">
                    </div>

                    <div class="space-y-1">
                        <div class="flex justify-between text-xs font-bold"><span>亮肌 (Bright)</span><span id="val-bright" class="text-pink-500">100</span></div>
                        <input type="range" data-filter="brightness" min="50" max="150" value="100" class="range range-xs" oninput="updateFilter(this)">
                    </div>

                    <div class="space-y-1">
                        <div class="flex justify-between text-xs font-bold"><span>鮮豔 (Vibrance)</span><span id="val-sat" class="text-pink-500">0</span></div>
                        <input type="range" data-filter="saturation" min="-100" max="100" value="0" class="range range-xs" oninput="updateFilter(this)">
                    </div>
                </section>

                <!-- 3. 美體調整 (Fallback) -->
                <section class="space-y-4">
                    <h4 class="text-[11px] font-black text-slate-400 uppercase tracking-widest">身形修飾</h4>
                    <div class="space-y-1">
                        <div class="flex justify-between text-xs font-bold"><span>長腿拉伸</span><span id="val-height" class="text-pink-500">100%</span></div>
                        <input type="range" id="body-height" min="100" max="115" value="100" class="range range-xs range-accent" oninput="updateBody(this)">
                    </div>
                </section>

                <!-- 4. 專業水印 -->
                <section class="space-y-4">
                    <h4 class="text-[11px] font-black text-slate-400 uppercase tracking-widest">相片資訊水印</h4>
                    <div class="form-control">
                        <label class="label cursor-pointer p-0">
                            <span class="label-text font-bold text-xs">顯示相機 EXIF 數據</span> 
                            <input type="checkbox" id="wm-toggle" class="toggle toggle-secondary toggle-sm" onchange="renderWatermark()">
                        </label>
                    </div>
                </section>

            </div>

            <!-- 底部資訊 -->
            <div class="p-4 bg-slate-50 border-t border-slate-100">
                <div class="flex items-center gap-2 opacity-40 grayscale mb-2">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/a/af/Adobe_Photoshop_CC_icon.svg" class="w-3 h-3">
                    <span class="text-[9px] font-bold">Powered by Fabric Rendering Engine</span>
                </div>
                <p class="text-[9px] text-slate-400 leading-tight">所有處理均在本地完成，100% 隱私安全保護</p>
            </div>
        </aside>
    </main>

    <script>
        let canvas, mainImg, exifData = {};

        // 初始化
        window.onload = async () => {
            canvas = new fabric.Canvas('canvas', { selection: false });
            await initAI();
        };

        async function initAI() {
            const status = document.getElementById('ai-status');
            try {
                const URL = 'https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js/weights/';
                await Promise.all([
                    faceapi.nets.ssdMobilenetv1.loadFromUri(URL),
                    faceapi.nets.faceLandmark68Net.loadFromUri(URL)
                ]);
                status.innerText = "AI 偵測就緒";
                status.classList.replace('badge-ghost', 'badge-success');
                status.classList.add('text-white');
            } catch (e) {
                status.innerText = "基礎模式";
            }
        }

        function handleImageUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(f) {
                const imgElement = new Image();
                imgElement.src = f.target.result;
                imgElement.onload = function() {
                    EXIF.getData(imgElement, function() {
                        exifData = EXIF.getAllTags(this);
                    });

                    fabric.Image.fromURL(f.target.result, (img) => {
                        canvas.clear();
                        const scale = Math.min(800 / img.width, 600 / img.height);
                        img.set({ scaleX: scale, scaleY: scale, selectable: false });
                        canvas.setDimensions({ width: img.getScaledWidth(), height: img.getScaledHeight() });
                        canvas.add(img);
                        mainImg = img;
                        document.getElementById('upload-guide').classList.add('opacity-0', 'pointer-events-none');
                    });
                };
            };
            reader.readAsDataURL(file);
        }

        function updateFilter(el) {
            if (!mainImg) return;
            const type = el.dataset.filter;
            const val = parseFloat(el.value);
            document.getElementById(`val-${type}`).innerText = val;

            const f = fabric.Image.filters;
            const filterMap = {
                'brightness': new f.Brightness({ brightness: (val - 100) / 100 }),
                'blur': new f.Blur({ blur: val / 15 }),
                'saturation': new f.Saturation({ saturation: val / 100 })
            };

            const idx = mainImg.filters.findIndex(it => it.type === type.charAt(0).toUpperCase() + type.slice(1));
            if (idx >= 0) mainImg.filters[idx] = filterMap[type];
            else mainImg.filters.push(filterMap[type]);

            mainImg.applyFilters();
            canvas.renderAll();
        }

        function updateBody(el) {
            if (!mainImg) return;
            const val = el.value;
            document.getElementById('val-height').innerText = val + '%';
            mainImg.set('scaleY', (canvas.height / mainImg.height) * (val/100));
            canvas.renderAll();
        }

        function renderWatermark() {
            const old = canvas.getObjects('text');
            old.forEach(o => canvas.remove(o));
            
            if (document.getElementById('wm-toggle').checked) {
                const model = exifData.Model || "Professional Camera";
                const date = exifData.DateTime || new Date().toLocaleDateString();
                const wm = new fabric.Text(`${model} | ${date}`, {
                    fontSize: 14, fill: '#fff', left: 20, top: canvas.height - 30,
                    fontFamily: 'Helvetica', backgroundColor: 'rgba(0,0,0,0.3)'
                });
                canvas.add(wm);
            }
            canvas.renderAll();
        }

        function applyPreset(type) {
            if (type === 'glam') {
                updateFilterValue('blur', 8);
                updateFilterValue('brightness', 110);
            } else {
                updateFilterValue('blur', 0);
                updateFilterValue('brightness', 100);
            }
        }

        function updateFilterValue(type, val) {
            const input = document.querySelector(`input[data-filter="${type}"]`);
            input.value = val;
            updateFilter(input);
        }

        function exportImage() {
            const link = document.createElement('a');
            link.download = `ChicTouch_Pro_${Date.now()}.jpg`;
            link.href = canvas.toDataURL({ format: 'jpeg', quality: 0.9, multiplier: 2 });
            link.click();
        }
    </script>
</body>
</html>
