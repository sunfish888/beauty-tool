<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>手痕靚靚 Lite</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#111827;
    color:white;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    min-height:100vh;
    padding:20px;
}

.container{
    max-width:1100px;
    margin:auto;
}

.title{
    text-align:center;
    margin-bottom:25px;
}

.title h1{
    font-size:42px;
    margin-bottom:10px;
    color:#ffd54f;
}

.title p{
    color:#cbd5e1;
}

.card{
    background:#1f2937;
    border-radius:20px;
    padding:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.3);
}

.topbar{
    display:flex;
    gap:15px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

button,label.upload-btn{
    background:#22c55e;
    border:none;
    padding:12px 18px;
    border-radius:12px;
    color:white;
    cursor:pointer;
    font-size:15px;
    transition:.2s;
}

button:hover,
label.upload-btn:hover{
    transform:translateY(-2px);
    opacity:.9;
}

.secondary{
    background:#3b82f6;
}

.danger{
    background:#ef4444;
}

input[type=file]{
    display:none;
}

.workspace{
    display:grid;
    grid-template-columns:1fr 320px;
    gap:20px;
}

.canvas-wrap{
    background:#0f172a;
    border-radius:20px;
    padding:15px;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:600px;
    overflow:hidden;
}

canvas{
    max-width:100%;
    border-radius:12px;
    background:black;
}

.panel{
    background:#111827;
    border-radius:20px;
    padding:20px;
}

.panel h2{
    margin-bottom:20px;
    color:#fbbf24;
}

.control{
    margin-bottom:25px;
}

.control label{
    display:block;
    margin-bottom:10px;
    color:#e5e7eb;
}

.slider-value{
    float:right;
    color:#fbbf24;
}

input[type=range]{
    width:100%;
}

.filter-buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.filter-buttons button{
    width:100%;
}

.footer-btns{
    display:flex;
    flex-direction:column;
    gap:12px;
    margin-top:30px;
}

.notice{
    margin-top:20px;
    font-size:13px;
    color:#94a3b8;
    line-height:1.6;
}

@media(max-width:900px){
    .workspace{
        grid-template-columns:1fr;
    }

    .canvas-wrap{
        min-height:400px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="title">
        <h1>✨ 手痕靚靚 Lite</h1>
        <p>AI 感覺自拍美顏工具（HTML版）</p>
    </div>

    <div class="card">

        <div class="topbar">

            <label class="upload-btn">
                📷 上載圖片
                <input type="file" id="upload" accept="image/*">
            </label>

            <button id="resetBtn" class="danger">
                ↺ 還原原圖
            </button>

        </div>

        <div class="workspace">

            <div class="canvas-wrap">
                <canvas id="canvas"></canvas>
            </div>

            <div class="panel">

                <h2>美顏控制台</h2>

                <div class="control">
                    <label>
                        ✨ 美白
                        <span class="slider-value" id="brightVal">100%</span>
                    </label>
                    <input type="range" id="brightness" min="50" max="180" value="100">
                </div>

                <div class="control">
                    <label>
                        🧴 磨皮
                        <span class="slider-value" id="blurVal">0px</span>
                    </label>
                    <input type="range" id="blur" min="0" max="10" value="0">
                </div>

                <div class="control">
                    <label>
                        🌈 飽和度
                        <span class="slider-value" id="satVal">100%</span>
                    </label>
                    <input type="range" id="saturation" min="50" max="200" value="100">
                </div>

                <div class="control">
                    <label>
                        ☀️ 柔光
                        <span class="slider-value" id="contrastVal">100%</span>
                    </label>
                    <input type="range" id="contrast" min="50" max="180" value="100">
                </div>

                <div class="control">
                    <label>🎨 一鍵風格</label>

                    <div class="filter-buttons">

                        <button onclick="presetNatural()">
                            自然感
                        </button>

                        <button onclick="presetKorean()">
                            韓系
                        </button>

                        <button onclick="presetVintage()">
                            港風
                        </button>

                        <button onclick="presetCreamy()">
                            奶油肌
                        </button>

                    </div>
                </div>

                <div class="footer-btns">

                    <button class="secondary" onclick="downloadImage()">
                        ⬇️ 下載作品
                    </button>

                </div>

                <div class="notice">
                    支援 JPG / PNG / WEBP<br>
                    本版本為《手痕靚靚 Lite》<br>
                    下一版可加入 AI 瘦面、大眼、人臉識別。
                </div>

            </div>

        </div>

    </div>

</div>

<script>

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const upload = document.getElementById('upload');

const brightness = document.getElementById('brightness');
const blur = document.getElementById('blur');
const saturation = document.getElementById('saturation');
const contrast = document.getElementById('contrast');

const brightVal = document.getElementById('brightVal');
const blurVal = document.getElementById('blurVal');
const satVal = document.getElementById('satVal');
const contrastVal = document.getElementById('contrastVal');

const resetBtn = document.getElementById('resetBtn');

let originalImage = null;

upload.addEventListener('change', loadImage);

function loadImage(e){

    const file = e.target.files[0];

    if(!file) return;

    const reader = new FileReader();

    reader.onload = function(event){

        const img = new Image();

        img.onload = function(){

            originalImage = img;

            canvas.width = img.width;
            canvas.height = img.height;

            resetControls();

            renderImage();

        };

        img.src = event.target.result;
    };

    reader.readAsDataURL(file);
}

function renderImage(){

    if(!originalImage) return;

    ctx.clearRect(0,0,canvas.width,canvas.height);

    ctx.filter = `
        brightness(${brightness.value}%)
        blur(${blur.value}px)
        saturate(${saturation.value}%)
        contrast(${contrast.value}%)
    `;

    ctx.drawImage(originalImage,0,0);

    brightVal.innerText = brightness.value + "%";
    blurVal.innerText = blur.value + "px";
    satVal.innerText = saturation.value + "%";
    contrastVal.innerText = contrast.value + "%";
}

brightness.addEventListener('input', renderImage);
blur.addEventListener('input', renderImage);
saturation.addEventListener('input', renderImage);
contrast.addEventListener('input', renderImage);

function resetControls(){

    brightness.value = 100;
    blur.value = 0;
    saturation.value = 100;
    contrast.value = 100;
}

resetBtn.addEventListener('click', ()=>{

    resetControls();
    renderImage();

});

function presetNatural(){

    brightness.value = 108;
    blur.value = 1;
    saturation.value = 108;
    contrast.value = 105;

    renderImage();
}

function presetKorean(){

    brightness.value = 120;
    blur.value = 2;
    saturation.value = 115;
    contrast.value = 108;

    renderImage();
}

function presetVintage(){

    brightness.value = 95;
    blur.value = 1;
    saturation.value = 85;
    contrast.value = 120;

    renderImage();
}

function presetCreamy(){

    brightness.value = 125;
    blur.value = 3;
    saturation.value = 105;
    contrast.value = 95;

    renderImage();
}

function downloadImage(){

    if(!originalImage){
        alert("請先上載圖片");
        return;
    }

    const link = document.createElement('a');

    link.download = '手痕靚靚作品.png';
    link.href = canvas.toDataURL();

    link.click();
}

</script>

</body>
</html>
