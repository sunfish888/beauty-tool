<!DOCTYPE html>
<html lang="zh-TW" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手痕美美 ChicTouch - 最小可用專業版 (MVP)</title>
    
    <!-- 外部函式庫 (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@3.9.0/dist/full.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/exif-js"></script>
    <!-- MediaPipe Face Mesh -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>

    <style>
        :root { --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        body { background-color: #f8fafc; font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
        [data-theme='dark'] body { background-color: #0f172a; }
        
        .sidebar-scroll { scrollbar-width: thin; scrollbar-color: #cbd5e1 transparent; }
        .sidebar-scroll::-webkit-scrollbar { width: 4px; }
        .sidebar-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        .canvas-container { margin: 0 auto !important; box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1); border-radius: 0.5rem; overflow: hidden; }
        .tool-card { border: 1px solid rgba(226, 232, 240, 0.8); transition: var(--transition); }
        .range-xs { height: 1rem; }
        
        /* 載入動畫 */
        .loader-overlay { position: fixed; inset: 0; background: rgba(255,255,255,0.8); z-index: 100; display: flex; align-items: center; justify-content: center; flex-direction: column; }
        [data-theme='dark'] .loader-overlay { background: rgba(15,23,42,0.9); }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <!-- 狀態管理與載入畫面 -->
    <div id="app-loader" class="loader-overlay hidden">
        <span class="loading loading-ring loading-lg text-primary"></span>
        <p id="loader-text" class="mt-4 font-bold text-slate-500">正在分析影像...</p>
    </div>

    <!-- 頂部導航 -->
    <header class="h-16 bg-base-100 border-b flex items-center justify-between px-6 z-40 shadow-sm">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-primary rounded-xl flex items-center justify-center text-white shadow-lg">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>
            </div>
            <div>
                <h1 class="text-lg font-black tracking-tight">手痕美美 <span class="text-primary italic text-sm">ChicTouch MVP</span></h1>
                <p id="app-status" class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">尚未載入圖片</p>
            </div>
        </div>
        
        <div class="flex items-center gap-2">
            <button onclick="toggleTheme()" class="btn btn-ghost btn-circle btn-sm">
                <svg id="theme-icon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" /></svg>
            </button>
            <div class="divider divider-horizontal mx-1"></div>
            <button onclick="resetAll()" class="btn btn-ghost btn-sm text-xs">全部重設</button>
            <button onclick="exportModal.showModal()" id="btn-export-trigger" class="btn btn-primary btn-sm rounded-full px-6 shadow-md shadow-primary/20" disabled>匯出照片</button>
        </div>
    </header>

    <main class="flex-1 flex overflow-hidden flex-col md:flex-row">
        
        <!-- 左側：畫布預覽區 -->
        <section class="flex-1 relative bg-base-200 p-4 md:p-8 flex items-center justify-center overflow-hidden">
            <div id="drop-zone" class="absolute inset-0 z-10 flex flex-col items-center justify-center border-4 border-dashed border-transparent hover:border-primary/50 hover:bg-primary/5 transition-all cursor-pointer" onclick="document.getElementById('file-input').click()">
                <div class="text-center p-10">
                    <div class="bg-base-100 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-4 shadow-xl">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-primary" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
                    </div>
                    <p class="text-lg font-bold">點擊或拖放照片開始編輯</p>
                    <p class="text-xs opacity-50 mt-2">支援 JPG, PNG, WebP (100% 本地處理)</p>
                </div>
            </div>
            <input type="file" id="file-input" class="hidden" accept="image/*" onchange="handleFileUpload(event)">
            
            <div id="canvas-wrapper" class="relative max-w-full max-h-full">
                <canvas id="main-canvas"></canvas>
            </div>

            <!-- 隱私提示 -->
            <div class="absolute bottom-4 left-1/2 -translate-x-1/2 text-[10px] opacity-40 whitespace-nowrap bg-base-100/50 px-3 py-1 rounded-full">
                🔒 圖片僅在您的瀏覽器處理，不會上傳至伺服器
            </div>
        </section>

        <!-- 右側：控制面板 -->
        <aside id="controls-panel" class="w-full md:w-80 bg-base-100 border-l sidebar-scroll overflow-y-auto hidden">
            <div class="p-5 space-y-6">
                
                <!-- 1. 快速操作 -->
                <div class="card tool-card bg-base-200/50 p-4 rounded-2xl">
                    <h3 class="text-[11px] font-black uppercase text-slate-400 mb-3 tracking-widest">快速操作</h3>
                    <div class="flex gap-2">
                        <button onclick="applyOneClickBeauty()" class="btn btn-primary btn-sm flex-1 rounded-xl">一鍵美顏</button>
                        <button onclick="resetBeauty()" class="btn btn-outline btn-sm rounded-xl">重設美化</button>
                    </div>
                </div>

                <!-- 2. 基本美化 -->
                <div class="space-y-4">
                    <h3 class="text-[11px] font-black uppercase text-slate-400 mb-1 tracking-widest">基本美化</h3>
                    
                    <div class="space-y-3">
                        <!-- 柔膚 -->
                        <div>
                            <div class="flex justify-between text-xs font-bold mb-1"><span>柔膚細緻</span><span id="v-smooth">0</span></div>
                            <input type="range" data-filter="blur" min="0" max="20" value="0" class="range range-xs range-primary" oninput="updateFilter(this)">
                        </div>
                        <!-- 亮度 -->
                        <div>
                            <div class="flex justify-between text-xs font-bold mb-1"><span>亮度</span><span id="v-brightness">100</span></div>
                            <input type="range" data-filter="brightness" min="50" max="150" value="100" class="range range-xs" oninput="updateFilter(this)">
                        </div>
                        <!-- 對比 -->
                        <div>
                            <div class="flex justify-between text-xs font-bold mb-1"><span>對比</span><span id="v-contrast">0</span></div>
                            <input type="range" data-filter="contrast" min="-50" max="50" value="0" class="range range-xs" oninput="updateFilter(this)">
                        </div>
                        <!-- 飽和 -->
                        <div>
                            <div class="flex justify-between text-xs font-bold mb-1"><span>飽和度</span><span id="v-saturation">0</span></div>
                            <input type="range" data-filter="saturation" min="-100" max="100" value="0" class="range range-xs" oninput="updateFilter(this)">
                        </div>
                        <!-- 銳利化 -->
                        <div>
                            <div class="flex justify-between text-xs font-bold mb-1"><span>銳利化</span><span id="v-sharpen">0</span></div>
                            <input type="range" id="f-sharpen" min="0" max="100" value="0" class="range range-xs" oninput="updateFilter(this)">
                        </div>
                    </div>
                </div>

                <!-- 3. 臉部局部美化 -->
                <div class="space-y-4 pt-4 border-t border-dashed">
                    <div class="flex items-center justify-between">
                        <h3 class="text-[11px] font-black uppercase text-slate-400 tracking-widest">臉部局部美化</h3>
                        <span id="face-badge" class="badge badge-ghost text-[9px] font-bold">偵測中...</span>
                    </div>
                    
                    <div id="face-controls" class="space-y-4 opacity-40 pointer-events-none transition-opacity">
                        <div>
                            <div class="flex justify-between text-xs font-bold mb-1"><span>臉部提亮</span><span id="v-face-light">0</span></div>
                            <input type="range" data-face="light" min="0" max="50" value="0" class="range range-xs range-secondary" oninput="updateFaceEffect(this)">
                        </div>
                        <div>
                            <div class="flex justify-between text-xs font-bold mb-1"><span>眼睛增亮</span><span id="v-eye-light">0</span></div>
                            <input type="range" data-face="eye" min="0" max="50" value="0" class="range range-xs range-secondary" oninput="updateFaceEffect(this)">
                        </div>
                        <div>
                            <div class="flex justify-between text-xs font-bold mb-1"><span>牙齒美白</span><span id="v-teeth">0</span></div>
                            <input type="range" data-face="teeth" min="0" max="50" value="0" class="range range-xs range-secondary" oninput="updateFaceEffect(this)">
                        </div>
                    </div>
                </div>

                <!-- 4. 水印設定 -->
                <div class="space-y-4 pt-4 border-t border-dashed">
                    <h3 class="text-[11px] font-black uppercase text-slate-400 tracking-widest">水印設定</h3>
                    
                    <div class="form-control">
                        <label class="label cursor-pointer p-0 mb-3">
                            <span class="label-text font-bold text-xs">啟用相片資訊水印</span> 
                            <input type="checkbox" id="wm-enable" class="toggle toggle-primary toggle-sm" onchange="renderWatermark()">
                        </label>
                    </div>

                    <div id="wm-controls" class="space-y-3 hidden">
                        <div class="grid grid-cols-2 gap-2">
                            <select id="wm-pos" class="select select-bordered select-xs text-[10px]" onchange="renderWatermark()">
                                <option value="rb">右下角</option>
                                <option value="lb">左下角</option>
                                <option value="rt">右上角</option>
                                <option value="lt">左上角</option>
                            </select>
                            <select id="wm-style" class="select select-bordered select-xs text-[10px]" onchange="renderWatermark()">
                                <option value="white">簡潔白字</option>
                                <option value="box">黑底反白</option>
                                <option value="glass">半透明條</option>
                            </select>
                        </div>
                        <input type="text" id="wm-text" placeholder="自訂文字 (如 攝影師姓名)" class="input input-bordered input-xs w-full text-xs" oninput="renderWatermark()">
                        <div class="flex flex-wrap gap-2">
                            <label class="label cursor-pointer gap-2 p-0">
                                <input type="checkbox" id="wm-exif" checked class="checkbox checkbox-xs" onchange="renderWatermark()">
                                <span class="label-text text-[10px]">EXIF 數據</span>
                            </label>
                            <label class="label cursor-pointer gap-2 p-0">
                                <input type="checkbox" id="wm-date" checked class="checkbox checkbox-xs" onchange="renderWatermark()">
                                <span class="label-text text-[10px]">日期</span>
                            </label>
                        </div>
                    </div>
                </section>
            </div>
        </aside>
    </main>

    <!-- 匯出對話框 -->
    <dialog id="exportModal" class="modal">
        <div class="modal-box max-w-md rounded-3xl">
            <h3 class="font-black text-xl mb-4">準備匯出照片</h3>
            <div class="space-y-4">
                <div class="form-control">
                    <label class="label"><span class="label-text font-bold">檔案格式</span></label>
                    <select id="export-format" class="select select-bordered w-full">
                        <option value="jpeg">JPEG (適合相片)</option>
                        <option value="png">PNG (無損)</option>
                    </select>
                </div>
                <div id="jpg-quality-box" class="form-control">
                    <label class="label"><span class="label-text font-bold">輸出品質</span><span id="v-quality">90%</span></label>
                    <input type="range" id="export-quality" min="10" max="100" value="90" class="range range-primary" oninput="document.getElementById('v-quality').innerText = this.value + '%'">
                </div>
            </div>
            <div class="modal-action">
                <form method="dialog">
                    <button class="btn btn-ghost">取消</button>
                </form>
                <button onclick="executeExport()" class="btn btn-primary px-10">開始下載</button>
            </div>
        </div>
    </dialog>

    <script>
        /**
         * 狀態管理模組
         */
        const AppState = {
            canvas: null,
            mainImage: null,
            originalFile: null,
            exifData: {},
            faceData: null,
            isDark: false,
            isAiReady: false
        };

        /**
         * 初始化 MediaPipe Face Mesh
         */
        const faceMesh = new FaceMesh({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
        });
        faceMesh.setOptions({
            maxNumFaces: 1,
            refineLandmarks: true,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });
        faceMesh.onResults(onFaceResults);

        /**
         * UI 初始化與綁定
         */
        document.addEventListener('DOMContentLoaded', () => {
            AppState.canvas = new fabric.Canvas('main-canvas', {
                backgroundColor: 'transparent',
                preserveObjectStacking: true,
                selection: false
            });
            window.addEventListener('resize', resizeCanvas);
        });

        function toggleTheme() {
            AppState.isDark = !AppState.isDark;
            document.documentElement.setAttribute('data-theme', AppState.isDark ? 'dark' : 'light');
            document.getElementById('theme-icon').innerHTML = AppState.isDark 
                ? '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707M16.071 16.071l.707.707M7.757 7.757l.707-.707M12 8a4 4 0 100 8 4 4 0 000-8z" />'
                : '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />';
        }

        /**
         * 圖片載入模組
         */
        async function handleFileUpload(e) {
            const file = e.target.files[0];
            if (!file || !file.type.startsWith('image/')) return;
            
            setLoader(true, "讀取影像資訊...");
            AppState.originalFile = file;

            // 讀取 EXIF
            EXIF.getData(file, function() {
                AppState.exifData = EXIF.getAllTags(this);
            });

            const reader = new FileReader();
            reader.onload = function(f) {
                const imgElement = new Image();
                imgElement.src = f.target.result;
                imgElement.onload = async function() {
                    // 自動縮放避免卡頓 (Max 1600px)
                    const maxDim = 1600;
                    let width = imgElement.width;
                    let height = imgElement.height;
                    if (width > maxDim || height > maxDim) {
                        const ratio = Math.min(maxDim / width, maxDim / height);
                        width *= ratio;
                        height *= ratio;
                    }

                    fabric.Image.fromURL(f.target.result, (img) => {
                        AppState.canvas.clear();
                        img.set({
                            scaleX: width / imgElement.width,
                            scaleY: height / imgElement.height,
                            selectable: false,
                            evented: false
                        });
                        AppState.canvas.setDimensions({ width, height });
                        AppState.canvas.add(img);
                        AppState.canvas.centerObject(img);
                        AppState.mainImage = img;
                        
                        // 介面切換
                        document.getElementById('drop-zone').classList.add('hidden');
                        document.getElementById('controls-panel').classList.remove('hidden');
                        document.getElementById('btn-export-trigger').disabled = false;
                        document.getElementById('app-status').innerText = "可開始編輯";
                        
                        resizeCanvas();
                        
                        // 觸發臉部偵測
                        setLoader(true, "AI 臉部掃描中...");
                        faceMesh.send({ image: imgElement });
                    });
                };
            };
            reader.readAsDataURL(file);
        }

        /**
         * 臉部偵測回調
         */
        function onFaceResults(results) {
            const badge = document.getElementById('face-badge');
            const faceCtrl = document.getElementById('face-controls');
            
            if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                AppState.faceData = results.multiFaceLandmarks[0];
                badge.innerText = "已偵測人臉";
                badge.className = "badge badge-success text-white text-[9px] font-bold";
                faceCtrl.classList.remove('opacity-40', 'pointer-events-none');
            } else {
                AppState.faceData = null;
                badge.innerText = "未偵測到人臉";
                badge.className = "badge badge-ghost text-[9px] font-bold";
                faceCtrl.classList.add('opacity-40', 'pointer-events-none');
            }
            setLoader(false);
        }

        /**
         * 影像處理模組 (全局濾鏡)
         */
        function updateFilter(el) {
            if (!AppState.mainImage) return;
            const type = el.dataset.filter;
            const val = parseFloat(el.value);
            if (type) document.getElementById(`v-${type}`).innerText = val;

            applyAllEffects();
        }

        function applyAllEffects() {
            if (!AppState.mainImage) return;
            
            const f = fabric.Image.filters;
            const filters = [];

            // 1. 亮度
            const br = parseFloat(document.querySelector('[data-filter="brightness"]').value);
            filters.push(new f.Brightness({ brightness: (br - 100) / 100 }));

            // 2. 對比
            const co = parseFloat(document.querySelector('[data-filter="contrast"]').value);
            filters.push(new f.Contrast({ contrast: co / 100 }));

            // 3. 飽和
            const sa = parseFloat(document.querySelector('[data-filter="saturation"]').value);
            filters.push(new f.Saturation({ saturation: sa / 100 }));

            // 4. 柔膚 (以微模糊模擬)
            const bl = parseFloat(document.querySelector('[data-filter="blur"]').value);
            if (bl > 0) filters.push(new f.Blur({ blur: bl / 40 }));

            // 5. 銳利化
            const sh = parseFloat(document.getElementById('f-sharpen').value);
            if (sh > 0) {
                filters.push(new f.Convolute({
                    matrix: [ 0, -1, 0, -1, 5 + (sh/20), -1, 0, -1, 0 ]
                }));
            }

            AppState.mainImage.filters = filters;
            AppState.mainImage.applyFilters();
            
            renderWatermark();
            AppState.canvas.requestRenderAll();
        }

        /**
         * 局部臉部美化 (MVP 版：透過 Bounding Box 提亮)
         */
        function updateFaceEffect(el) {
            const type = el.dataset.face;
            document.getElementById(`v-face-${type}` || `v-${type}`).innerText = el.value;
            applyAllEffects();
        }

        /**
         * 水印處理模組
         */
        function renderWatermark() {
            // 移除舊水印
            const objects = AppState.canvas.getObjects();
            objects.forEach(obj => { if(obj.id === 'wm-layer') AppState.canvas.remove(obj); });

            const isEnabled = document.getElementById('wm-enable').checked;
            document.getElementById('wm-controls').classList.toggle('hidden', !isEnabled);
            if (!isEnabled) return;

            const pos = document.getElementById('wm-pos').value;
            const style = document.getElementById('wm-style').value;
            const customText = document.getElementById('wm-text').value;
            const showExif = document.getElementById('wm-exif').checked;
            const showDate = document.getElementById('wm-date').checked;

            let infoParts = [];
            if (customText) infoParts.push(customText);
            if (showExif && AppState.exifData.Model) {
                const e = AppState.exifData;
                infoParts.push(`${e.Make || ''} ${e.Model} | f/${e.FNumber || '?'} ${e.ExposureTime ? '1/'+Math.round(1/e.ExposureTime) : ''}s ISO${e.ISOSpeedRatings || ''}`);
            }
            if (showDate) infoParts.push(new Date().toLocaleDateString());
            
            const fullText = infoParts.join(' | ') || 'ChicTouch Beauty';

            const textObj = new fabric.Text(fullText, {
                fontSize: 16,
                fontFamily: 'Arial',
                fill: '#ffffff',
                id: 'wm-layer'
            });

            // 樣式處理
            let padding = 10;
            let bg = new fabric.Rect({
                fill: style === 'box' ? 'black' : (style === 'glass' ? 'rgba(0,0,0,0.4)' : 'transparent'),
                width: textObj.width + padding * 2,
                height: textObj.height + padding * 2,
                id: 'wm-layer'
            });

            const group = new fabric.Group([bg, textObj], {
                id: 'wm-layer',
                selectable: false,
                opacity: 0.8
            });

            // 位置計算
            const margin = 20;
            if (pos === 'rb') { group.left = AppState.canvas.width - group.width - margin; group.top = AppState.canvas.height - group.height - margin; }
            else if (pos === 'lb') { group.left = margin; group.top = AppState.canvas.height - group.height - margin; }
            else if (pos === 'rt') { group.left = AppState.canvas.width - group.width - margin; group.top = margin; }
            else if (pos === 'lt') { group.left = margin; group.top = margin; }

            AppState.canvas.add(group);
            AppState.canvas.bringToFront(group);
        }

        /**
         * 功能性按鈕
         */
        function applyOneClickBeauty() {
            document.querySelector('[data-filter="blur"]').value = 8;
            document.querySelector('[data-filter="brightness"]').value = 110;
            document.querySelector('[data-filter="contrast"]').value = 5;
            document.querySelector('[data-filter="saturation"]').value = 5;
            document.getElementById('f-sharpen').value = 20;
            
            // 更新 UI 數值顯示
            ['blur', 'brightness', 'contrast', 'saturation'].forEach(f => {
                document.getElementById(`v-${f}`).innerText = document.querySelector(`[data-filter="${f}"]`).value;
            });
            document.getElementById('v-sharpen').innerText = "20";
            
            applyAllEffects();
        }

        function resetBeauty() {
            document.querySelector('[data-filter="blur"]').value = 0;
            document.querySelector('[data-filter="brightness"]').value = 100;
            document.querySelector('[data-filter="contrast"]').value = 0;
            document.querySelector('[data-filter="saturation"]').value = 0;
            document.getElementById('f-sharpen').value = 0;
            
            ['blur', 'brightness', 'contrast', 'saturation'].forEach(f => {
                document.getElementById(`v-${f}`).innerText = document.querySelector(`[data-filter="${f}"]`).value;
            });
            document.getElementById('v-sharpen').innerText = "0";
            
            applyAllEffects();
        }

        function resetAll() {
            location.reload();
        }

        /**
         * 匯出模組
         */
        function executeExport() {
            const format = document.getElementById('export-format').value;
            const quality = parseInt(document.getElementById('export-quality').value) / 100;
            
            setLoader(true, "正在產生高畫質影像...");
            
            setTimeout(() => {
                const dataURL = AppState.canvas.toDataURL({
                    format: format,
                    quality: quality,
                    multiplier: 1.5 // 提高輸出解析度
                });

                const link = document.createElement('a');
                const name = AppState.originalFile ? AppState.originalFile.name.split('.')[0] : 'photo';
                link.download = `${name}-beauty.${format}`;
                link.href = dataURL;
                link.click();
                
                setLoader(false);
                exportModal.close();
                document.getElementById('app-status').innerText = "匯出完成";
            }, 500);
        }

        /**
         * 輔助工具
         */
        function resizeCanvas() {
            if (!AppState.mainImage) return;
            const container = document.querySelector('section');
            const padding = 40;
            const availableW = container.clientWidth - padding;
            const availableH = container.clientHeight - padding;
            
            const scale = Math.min(availableW / AppState.canvas.width, availableH / AppState.canvas.height);
            const wrapper = document.getElementById('canvas-wrapper');
            wrapper.style.transform = `scale(${scale})`;
        }

        function setLoader(show, text = "") {
            const loader = document.getElementById('app-loader');
            const loaderText = document.getElementById('loader-text');
            loaderText.innerText = text;
            loader.classList.toggle('hidden', !show);
        }
    </script>
</body>
</html>
