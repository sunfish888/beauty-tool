<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>手痕靚靚 AI Lite</title>

<!-- MediaPipe -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#0f172a;
    color:white;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    min-height:100vh;
    padding:20px;
}

.container{
    max-width:1400px;
    margin:auto;
}

.header{
    text-align:center;
    margin-bottom:25px;
}

.header h1{
    font-size:42px;
    color:#facc15;
    margin-bottom:10px;
}

.header p{
    color:#cbd5e1;
}

.main{
    display:grid;
    grid-template-columns:1fr 350px;
    gap:20px;
}

.viewer{
    background:#111827;
    border-radius:24px;
    padding:20px;
    box-shadow:0 10px 40px rgba(0,0,0,.4);

.canvas-wrap{
    position:relative;
    width:100%;

    border-radius:18px;

    display:flex;
    align-items:center;
    justify-content:center;
}

canvas{
    max-width:100%;
}

.panel{
    background:#111827;
    border-radius:24px;
    padding:20px;
    box-shadow:0 10px 40px rgba(0,0,0,.4);
}

.panel h2{
    margin-bottom:20px;
    color:#facc15;
}

.upload-box{
    margin-bottom:20px;
}

.upload-btn{
    width:100%;
    display:block;
    padding:14px;

    display:none;

    margin-bottom:28px;

.control label{
    display:flex;
    justify-content:space-between;

    color:#facc15;
}

    width:100%;

    width:100%;

</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>✨ 手痕靚靚 AI Lite</h1>
        <p>真正 FaceMesh AI 美顏 MVP</p>
    </div>

    <div class="main">

        <div class="viewer">

            <div class="canvas-wrap">
                <canvas id="canvas"></canvas>
            </div>

        </div>

        <div class="panel">

            <h2>AI 美顏控制台</h2>

            <div class="upload-box">

                <label class="upload-btn">
                    📷 上載圖片
                    <input type="file" id="upload" accept="image/*">
                </label>

            </div>

            <div class="control">
                <label>
                    ✨ 美白
                    <span id="brightValue">100%</span>
                </label>
                <input type="range" id="brightness" min="80" max="180" value="100">
            </div>

            <div class="control">
                <label>
                    🧴 AI 磨皮
                    <span id="smoothValue">0</span>
                </label>
                <input type="range" id="smooth" min="0" max="8" value="0">
            </div>

            <div class="control">
                <label>
                    👁️ 大眼
                    <span id="eyeValue">1.0x</span>
                </label>
                <input type="range" id="eye" min="1" max="1.8" step="0.05" value="1">
            </div>

            <div class="control">
                <label>
                    😎 瘦面
                    <span id="slimValue">0%</span>
                </label>
                <input type="range" id="slim" min="0" max="30" value="0">
            </div>

            <button class="download" onclick="downloadImage()">
                ⬇️ 下載作品
            </button>

            <button class="reset" onclick="resetBeauty()">
                ↺ 還原
            </button>

            <div class="notice">
                ✅ MediaPipe FaceMesh<br>
                ✅ AI 人臉識別<br>
                ✅ Landmark 偵測<br>
                ✅ AI 大眼<br>
                ✅ AI 瘦面<br>
                ✅ 真實局部美顏 MVP
            </div>

        </div>

    </div>

</div>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const upload = document.getElementById("upload");

const brightnessSlider = document.getElementById("brightness");
const smoothSlider = document.getElementById("smooth");
const eyeSlider = document.getElementById("eye");
const slimSlider = document.getElementById("slim");

const brightValue = document.getElementById("brightValue");
const smoothValue = document.getElementById("smoothValue");
const eyeValue = document.getElementById("eyeValue");
const slimValue = document.getElementById("slimValue");

let originalImage = null;
let faceLandmarks = null;

const faceMesh = new FaceMesh({
    locateFile: (file)=>{
        return `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`;
    }
});

faceMesh.setOptions({
    maxNumFaces:1,
    refineLandmarks:true,
    minDetectionConfidence:0.5,
    minTrackingConfidence:0.5
});

faceMesh.onResults(onFaceResults);

upload.addEventListener("change", async(e)=>{

    const file = e.target.files[0];

    if(!file) return;

    const img = new Image();

    img.onload = async()=>{

        originalImage = img;

        canvas.width = img.width;
        canvas.height = img.height;

        await faceMesh.send({image:img});
    };

    img.src = URL.createObjectURL(file);
});

function onFaceResults(results){

    if(results.multiFaceLandmarks.length > 0){

        faceLandmarks = results.multiFaceLandmarks[0];
    }

    renderBeauty();
}

function renderBeauty(){

    if(!originalImage) return;

    ctx.clearRect(0,0,canvas.width,canvas.height);

    ctx.filter = `
        brightness(${brightnessSlider.value}%)
        saturate(110%)
        contrast(105%)
    `;

    ctx.drawImage(originalImage,0,0);

    applySmoothSkin();

    if(faceLandmarks){

        applyBigEyes();
        applySlimFace();
    }

    brightValue.innerText = brightnessSlider.value + "%";
    smoothValue.innerText = smoothSlider.value;
    eyeValue.innerText = eyeSlider.value + "x";
    slimValue.innerText = slimSlider.value + "%";
}

function getPoint(index){

    return {
        x:faceLandmarks[index].x * canvas.width,
        y:faceLandmarks[index].y * canvas.height
    };
}

function applySmoothSkin(){

    const amount = parseInt(smoothSlider.value);

    if(amount <= 0) return;

    ctx.globalAlpha = 0.08 * amount;

    for(let i=0;i<amount;i++){

        ctx.filter = `
            blur(1.2px)
            brightness(${brightnessSlider.value}%)
        `;

        ctx.drawImage(canvas,0,0);
    }

    ctx.globalAlpha = 1;
}

function applyBigEyes(){

    const scale = parseFloat(eyeSlider.value);

    if(scale <= 1) return;

    enlargeEye(33, scale);
    enlargeEye(263, scale);
}

function enlargeEye(index, scale){

    const eye = getPoint(index);

    const size = 80;

    const temp = document.createElement("canvas");
    temp.width = size;
    temp.height = size;

    const tctx = temp.getContext("2d");

    tctx.drawImage(
        canvas,
        eye.x - size/2,
        eye.y - size/2,
        size,
        size,
        0,
        0,
        size,
        size
    );

    ctx.save();

    ctx.beginPath();
    ctx.arc(eye.x, eye.y, size/2, 0, Math.PI*2);
    ctx.clip();

    ctx.drawImage(
        temp,
        eye.x - (size*scale)/2,
        eye.y - (size*scale)/2,
        size*scale,
        size*scale
    );

    ctx.restore();
}

function applySlimFace(){

    const amount = parseInt(slimSlider.value);

    if(amount <= 0) return;

    const left = getPoint(234);
    const right = getPoint(454);

    const midX = (left.x + right.x)/2;

    const faceWidth = right.x - left.x;

    const cut = faceWidth * (amount / 200);

    ctx.drawImage(
        canvas,
        left.x,
        0,
        faceWidth,
        canvas.height,
        left.x + cut,
        0,
        faceWidth - cut*2,
        canvas.height
    );
}

brightnessSlider.addEventListener("input", renderBeauty);
smoothSlider.addEventListener("input", renderBeauty);
eyeSlider.addEventListener("input", renderBeauty);
slimSlider.addEventListener("input", renderBeauty);

function resetBeauty(){

    brightnessSlider.value = 100;
    smoothSlider.value = 0;
    eyeSlider.value = 1;
    slimSlider.value = 0;

    renderBeauty();
}

function downloadImage(){

    const link = document.createElement("a");

    link.download = "手痕靚靚_AI作品.png";

    link.href = canvas.toDataURL("image/png");

    link.click();
}

</script>

</body>
</html>
