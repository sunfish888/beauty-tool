<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手痕美美 Pro - 穩定版</title>
    <!-- 使用更穩定的 CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@3.9.0/dist/full.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/exif-js"></script>
    <style>
        body { background-color: #fff5f7; }
        .canvas-container { margin: 0 auto; border-radius: 1rem; overflow: hidden; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body>

<div class="max-w-4xl mx-auto py-8 px-4">
    <div class="card bg-white shadow-xl rounded-3xl overflow-hidden border border-pink-100">
        <!-- 頂部標題 -->
        <div class="p-5 bg-gradient-to-r from-pink-500 to-rose-400 text-white flex justify-between items-center">
            <h1 class="text-xl font-black tracking-tighter">CHICTOUCH PRO</h1>
            <div id="ai-status" class="badge badge-outline text-[10px]">正在喚醒 AI...</div>
        </div>

        <div class="flex flex-col lg:flex-row">
            <!-- 左側預覽區 -->
            <div class="flex-1 bg-slate-800 p-6 flex items-center justify-center min-h-[450px] relative">
                <canvas id="c"></canvas>
                <div id="drop-text" class="absolute inset-0 flex flex-col items-center justify-center text-white cursor-pointer hover:bg-black/20 transition" onclick="document.getElementById('f').click()">
                    <div class="w-16 h-16 bg-pink-500 rounded-full flex items-center justify-center mb-3 shadow-lg">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
                    </div>
                    <p class="font-bold">點擊上傳旅拍照片</p>
                    <p class="text-xs opacity-60 mt-1">支援 JPG, PNG, WebP</p>
                </div>
                <input type="file" id="f" class="hidden" accept="image/*">
            </div>

            <!-- 右側控制區 -->
            <div class="w-full lg:w-80 p-6 space-y-6">
                <div>
                    <label class="text-xs font-black text-gray-400 uppercase tracking-widest">柔膚細緻</label>
                    <input type="range" id="smooth" min="0" max="100" value="0" class="range range-secondary range-xs mt-2">
                </div>
                <div>
                    <label class="text-xs font-black text-gray-400 uppercase tracking-widest">美白亮度</label>
                    <input type="range" id="bright" min="50" max="150" value="100" class="range range-xs mt-2">
                </div>
                <div class="divider"></div>
                <div class="form-control">
                    <label class="label cursor-pointer">
                        <span class="label-text font-bold">顯示 EXIF 專業水印</span> 
                        <input type="checkbox" id="wm" class="toggle toggle-secondary" />
                    </label>
                </div>
                <button id="dl" class="btn btn-secondary w-full rounded-2xl shadow-lg shadow-pink-100 font-bold">下載美化成果</button>
                <div class="text-[9px] text-gray-400 text-center leading-tight">
                    所有處理均在您的瀏覽器完成<br>照片不會被傳輸到任何伺服器
                </div>
            </div>
        </div>
    </div>
</div>

<script>
const canvas = new fabric.Canvas('c', { renderOnAddRemove: true });
let imgObj = null;
let exifData = {};

// 1. 初始化 AI (使用更穩定的 CDN 源)
async function initAI() {
    const status = document.getElementById('ai-status');
    try {
        const MODEL_URL = 'https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js/weights/';
        await faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL);
        status.innerText = "AI 引擎已就緒";
        status.className = "badge badge-success text-white text-[10px]";
    } catch (e) {
        console.error(e);
        status.innerText = "基礎模式 (無 AI)";
        status.className = "badge badge-warning text-[10px]";
    }
}
initAI();

// 2. 圖片上傳處理
document.getElementById('f').onchange = function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(f) {
        fabric.Image.fromURL(f.target.result, function(img) {
            canvas.clear();
            const ratio = Math.min(600 / img.width, 500 / img.height);
            img.scale(ratio);
            canvas.setDimensions({ width: img.getScaledWidth(), height: img.getScaledHeight() });
            canvas.add(img);
            imgObj = img;
            document.getElementById('drop-text').style.display = 'none';
            EXIF.getData(img.getElement(), function() {
                exifData = EXIF.getAllTags(this);
            });
        });
    };
    reader.readAsDataURL(file);
};

// 3. 濾鏡引擎
function applyFilters() {
    if(!imgObj) return;
    const s = document.getElementById('smooth').value;
    const b = document.getElementById('bright').value;
    
    imgObj.filters = [
        new fabric.Image.filters.Brightness({ brightness: (b - 100) / 100 }),
        new fabric.Image.filters.Blur({ blur: s / 300 })
    ];
    imgObj.applyFilters();

    // 處理水印
    const oldTexts = canvas.getObjects('text');
    oldTexts.forEach(t => canvas.remove(t));
    if(document.getElementById('wm').checked) {
        const model = exifData.Model || "Smart Camera";
        const txt = new fabric.Text(model + " | " + new Date().toLocaleDateString(), {
            fontSize: 14, fill: '#ffffff', left: 15, top: canvas.height - 30,
            fontFamily: 'sans-serif', backgroundColor: 'rgba(0,0,0,0.4)'
        });
        canvas.add(txt);
    }
    canvas.renderAll();
}

document.getElementById('smooth').oninput = applyFilters;
document.getElementById('bright').oninput = applyFilters;
document.getElementById('wm').onchange = applyFilters;

// 4. 高清匯出
document.getElementById('dl').onclick = function() {
    if(!imgObj) return;
    const link = document.createElement('a');
    link.download = 'ChicTouch_Pro.jpg';
    link.href = canvas.toDataURL({ format: 'jpeg', quality: 0.9, multiplier: 2 });
    link.click();
};
</script>
</body>
</html>
